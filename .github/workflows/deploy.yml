# 纯静态站，没有构建步骤：把仓库原样发布到 GitHub Pages。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动重跑，不用为了重新部署造一个空提交
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署。连着推两次时取消不了排队中的那个会让后推的先上线，
# 结果是旧版本覆盖新版本。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # 后端地址不在仓库里，只在 secret 里。写成 config.js 一起发布。
      # secret 没配时这一步写个空的，页面打得开，走示例数据。
      - name: 生成 config.js
        env:
          API_BASE: ${{ secrets.API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::warning::没有配 API_BASE secret，站点会一直显示示例数据"
          fi
          printf 'window.APP_CONFIG = { apiBase: "%s" };\n' "$API_BASE" > config.js

      - uses: actions/upload-pages-artifact@v3
        with:
          # 整个仓库就是站点本身。.nojekyll 必须跟着传上去——
          # 少了它 Jekyll 会把 _ds/ 这种下划线开头的目录整个吃掉，
          # 页面能打开但没有任何样式。
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
